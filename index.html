<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kalaza Care — FAQ Assistant</title>
  <meta name="description"
    content="Get instant answers to your questions about Kalaza Care's senior living, at-home care, and medical recovery services.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet">
  <style>
    /* ------------------------------------------------------------------ */
    /* Design tokens                                                        */
    /* ------------------------------------------------------------------ */
    :root {
      --ink: #20302B;
      --paper: #FAF7F0;
      --deep: #1B4F4A;
      --deep-light: #1f5c56;
      --sage: #7FA99B;
      --sage-soft: #E4EEE9;
      --sand: #F0EAD6;
      --marigold: #E8A33D;
      --marigold-soft: #FBEAD1;
      --line: rgba(27, 79, 74, 0.13);
      --radius: 14px;
      --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.06), 0 1px 2px rgba(0, 0, 0, 0.04);
      --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.08), 0 1px 4px rgba(0, 0, 0, 0.04);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
    }

    body {
      background: var(--paper);
      color: var(--ink);
      font-family: 'Work Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ------------------------------------------------------------------ */
    /* Top nav bar                                                          */
    /* ------------------------------------------------------------------ */
    .topbar {
      background: var(--deep);
      padding: 0 28px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      position: relative;
      overflow: hidden;
    }

    .topbar::after {
      content: "";
      position: absolute;
      top: -80px;
      right: -80px;
      width: 200px;
      height: 200px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(232, 163, 61, 0.22), transparent 70%);
      pointer-events: none;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      position: relative;
      z-index: 1;
    }

    .brand .mark {
      width: 36px;
      height: 36px;
      border-radius: 9px;
      background: var(--marigold);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Fraunces', serif;
      font-weight: 600;
      color: var(--deep);
      font-size: 18px;
      flex-shrink: 0;
    }

    .brand-text h1 {
      font-family: 'Fraunces', serif;
      font-weight: 500;
      font-size: 17px;
      color: #FAF7F0;
      margin: 0;
      line-height: 1.2;
    }

    .brand-text p {
      font-size: 11.5px;
      color: rgba(250, 247, 240, 0.6);
      margin: 0;
    }

    .status-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(250, 247, 240, 0.08);
      border: 1px solid rgba(250, 247, 240, 0.18);
      border-radius: 20px;
      padding: 5px 12px;
      font-size: 12px;
      color: rgba(250, 247, 240, 0.75);
      font-family: 'JetBrains Mono', monospace;
      position: relative;
      z-index: 1;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #8FD4A8;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.45;
      }
    }

    /* ------------------------------------------------------------------ */
    /* Chat area                                                            */
    /* ------------------------------------------------------------------ */
    .chat-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      max-width: 760px;
      width: 100%;
      margin: 0 auto;
      padding: 0 16px;
      min-height: 0;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 28px 0 8px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      scroll-behavior: smooth;
    }

    .messages::-webkit-scrollbar {
      width: 5px;
    }

    .messages::-webkit-scrollbar-track {
      background: transparent;
    }

    .messages::-webkit-scrollbar-thumb {
      background: var(--sage-soft);
      border-radius: 10px;
    }

    /* ------------------------------------------------------------------ */
    /* Empty / welcome state                                                */
    /* ------------------------------------------------------------------ */
    .empty-state {
      margin: auto;
      text-align: center;
      max-width: 440px;
      padding: 24px 0;
    }

    .empty-state .glyph {
      font-family: 'Fraunces', serif;
      font-size: 44px;
      color: var(--marigold);
      margin-bottom: 12px;
      display: block;
    }

    .empty-state h2 {
      font-family: 'Fraunces', serif;
      font-weight: 500;
      color: var(--ink);
      font-size: 22px;
      margin: 0 0 10px;
    }

    .empty-state p {
      font-size: 14px;
      line-height: 1.65;
      color: rgba(32, 48, 43, 0.6);
      margin: 0 0 24px;
    }

    .starter-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
    }

    .starter-chip {
      font-family: 'Work Sans', sans-serif;
      font-size: 13px;
      padding: 9px 14px;
      background: var(--marigold-soft);
      color: #7A4E12;
      border: 1px solid rgba(232, 163, 61, 0.4);
      border-radius: 100px;
      cursor: pointer;
      transition: background .15s ease, transform .1s ease, box-shadow .15s ease;
      text-align: center;
      line-height: 1.4;
    }

    .starter-chip:hover {
      background: #F6D9A6;
      box-shadow: var(--shadow-sm);
      transform: translateY(-1px);
    }

    .starter-chip:active {
      transform: scale(0.97) translateY(0);
    }

    /* ------------------------------------------------------------------ */
    /* Message bubbles                                                      */
    /* ------------------------------------------------------------------ */
    .msg {
      display: flex;
      gap: 10px;
      max-width: 82%;
      animation: fadeUp .25s ease both;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .msg.user {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .avatar {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Fraunces', serif;
      font-size: 12px;
      font-weight: 600;
      margin-top: 2px;
    }

    .msg.user .avatar {
      background: var(--marigold-soft);
      color: #8A5A15;
    }

    .msg.bot .avatar {
      background: var(--deep);
      color: var(--paper);
    }

    .bubble {
      padding: 13px 16px;
      border-radius: var(--radius);
      font-size: 14.5px;
      line-height: 1.65;
    }

    .msg.user .bubble {
      background: var(--deep);
      color: var(--paper);
      border-bottom-right-radius: 4px;
    }

    .msg.bot .bubble {
      background: #fff;
      border: 1px solid var(--line);
      border-bottom-left-radius: 4px;
      box-shadow: var(--shadow-sm);
    }

    .msg.bot .bubble.error {
      background: #FDEDEC;
      border-color: #EAB4AC;
      color: #8A3A2E;
    }

    /* ------------------------------------------------------------------ */
    /* Suggestion chips inside bot bubble                                   */
    /* ------------------------------------------------------------------ */
    .suggestions {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px dashed var(--line);
    }

    .sugg-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: rgba(32, 48, 43, 0.4);
      font-weight: 500;
      margin-bottom: 2px;
    }

    .suggestion-chip {
      font-family: 'Work Sans', sans-serif;
      font-size: 13px;
      text-align: left;
      padding: 8px 12px;
      background: var(--marigold-soft);
      color: #7A4E12;
      border: 1px solid rgba(232, 163, 61, 0.35);
      border-radius: 10px;
      cursor: pointer;
      transition: background .15s ease, transform .1s ease;
      line-height: 1.4;
    }

    .suggestion-chip:hover {
      background: #F6D9A6;
    }

    .suggestion-chip:active {
      transform: scale(0.98);
    }

    /* ------------------------------------------------------------------ */
    /* Typing indicator                                                     */
    /* ------------------------------------------------------------------ */
    .typing {
      display: flex;
      gap: 4px;
      padding: 6px 2px;
    }

    .typing span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--sage);
      animation: bounce 1.1s infinite ease-in-out;
    }

    .typing span:nth-child(2) {
      animation-delay: .15s;
    }

    .typing span:nth-child(3) {
      animation-delay: .30s;
    }

    @keyframes bounce {

      0%,
      60%,
      100% {
        transform: translateY(0);
        opacity: .45;
      }

      30% {
        transform: translateY(-4px);
        opacity: 1;
      }
    }

    /* ------------------------------------------------------------------ */
    /* Composer                                                             */
    /* ------------------------------------------------------------------ */
    .composer {
      padding: 12px 0 20px;
      flex-shrink: 0;
    }

    .composer-inner {
      display: flex;
      gap: 10px;
      align-items: flex-end;
      background: #fff;
      border: 1.5px solid var(--line);
      border-radius: 18px;
      padding: 8px 8px 8px 18px;
      box-shadow: var(--shadow-sm);
      transition: border-color .15s ease, box-shadow .15s ease;
    }

    .composer-inner:focus-within {
      border-color: var(--sage);
      box-shadow: 0 0 0 3px rgba(127, 169, 155, 0.15), var(--shadow-sm);
    }

    .composer textarea {
      flex: 1;
      border: none;
      outline: none;
      resize: none;
      font-family: 'Work Sans', sans-serif;
      font-size: 14.5px;
      line-height: 1.5;
      padding: 8px 0;
      max-height: 120px;
      color: var(--ink);
      background: transparent;
    }

    .composer textarea::placeholder {
      color: rgba(32, 48, 43, 0.38);
    }

    .send-btn {
      background: var(--deep);
      color: var(--paper);
      border: none;
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: background .15s ease, transform .1s ease;
    }

    .send-btn:hover {
      background: var(--deep-light);
    }

    .send-btn:active {
      transform: scale(0.93);
    }

    .send-btn:disabled {
      background: #B9C3C0;
      cursor: not-allowed;
    }

    .composer-hint {
      font-size: 11.5px;
      color: rgba(32, 48, 43, 0.4);
      margin-top: 7px;
      padding-left: 4px;
    }
  </style>
</head>

<body>

  <!-- -------------------------------------------------------------------- -->
  <!-- Top bar                                                               -->
  <!-- -------------------------------------------------------------------- -->
  <header class="topbar" role="banner">
    <div class="brand">
      <div class="mark" aria-hidden="true">K</div>
      <div class="brand-text">
        <h1>Kalaza Care</h1>
        <p>FAQ Assistant</p>
      </div>
    </div>
    <div class="status-pill" aria-label="Service status: online">
      <span class="status-dot" aria-hidden="true"></span>
      Online
    </div>
  </header>

  <!-- -------------------------------------------------------------------- -->
  <!-- Chat                                                                  -->
  <!-- -------------------------------------------------------------------- -->
  <div class="chat-wrap" role="main">
    <div class="messages" id="messages" aria-live="polite" aria-label="Chat messages">

      <div class="empty-state" id="emptyState">
        <span class="glyph" aria-hidden="true">&#10022;</span>
        <h2>How can we help you today?</h2>
        <p>Ask anything about Kalaza Care's services, pricing, admissions, care plans, and more.</p>
        <div class="starter-chips" id="starterChips">
          <button class="starter-chip" type="button">What services do you offer?</button>
          <button class="starter-chip" type="button">How much does it cost?</button>
          <button class="starter-chip" type="button">How do I admit a family member?</button>
          <button class="starter-chip" type="button">What medical care is available?</button>
          <button class="starter-chip" type="button">Can family members visit?</button>
          <button class="starter-chip" type="button">What activities are available?</button>
        </div>
      </div>

    </div>

    <div class="composer" role="form" aria-label="Ask a question">
      <div class="composer-inner">
        <textarea id="userInput" placeholder="Ask about programs, eligibility, costs, care plans..." rows="1"
          aria-label="Your question"></textarea>
        <button class="send-btn" id="sendBtn" aria-label="Send message" type="button">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M4 12L20 4L13 20L11 13L4 12Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"
              stroke-linecap="round" />
          </svg>
        </button>
      </div>
      <div class="composer-hint" aria-hidden="true">Enter to send &middot; Shift+Enter for a new line</div>
    </div>
  </div>

  <script>
    // ---------------------------------------------------------------------------
    // Config — update BACKEND_URL to your Railway deployment URL.
    // Example: "https://kalaza-care-production.up.railway.app"
    // ---------------------------------------------------------------------------
    const BACKEND_URL = "https://kalaza-care-faq-whatsapp-chatbot-production.up.railway.app";

    // ---------------------------------------------------------------------------
    // DOM refs
    // ---------------------------------------------------------------------------
    const els = {
      messages: document.getElementById('messages'),
      emptyState: document.getElementById('emptyState'),
      userInput: document.getElementById('userInput'),
      sendBtn: document.getElementById('sendBtn'),
      starterChips: document.getElementById('starterChips'),
    };

    // ---------------------------------------------------------------------------
    // Starter chip clicks
    // ---------------------------------------------------------------------------
    els.starterChips.querySelectorAll('.starter-chip').forEach(chip => {
      chip.addEventListener('click', () => {
        els.userInput.value = chip.textContent.trim();
        autosize();
        handleSend();
      });
    });

    // ---------------------------------------------------------------------------
    // Chat UI helpers
    // ---------------------------------------------------------------------------
    function escapeHtml(str) {
      const d = document.createElement('div');
      d.textContent = str;
      return d.innerHTML;
    }

    function formatAnswer(text) {
      return escapeHtml(text).replace(/\n/g, '<br>');
    }

    function addMessage(role, html, suggestions) {
      els.emptyState.style.display = 'none';

      const msg = document.createElement('div');
      msg.className = 'msg ' + role;

      const avatar = document.createElement('div');
      avatar.className = 'avatar';
      avatar.textContent = role === 'user' ? 'You' : 'K';
      avatar.setAttribute('aria-hidden', 'true');

      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.innerHTML = html;

      if (suggestions && suggestions.length) {
        const wrap = document.createElement('div');
        wrap.className = 'suggestions';
        const label = document.createElement('div');
        label.className = 'sugg-label';
        label.textContent = 'You might also ask';
        wrap.appendChild(label);
        suggestions.forEach(s => {
          const chip = document.createElement('button');
          chip.type = 'button';
          chip.className = 'suggestion-chip';
          chip.textContent = s.question;
          chip.addEventListener('click', () => useSuggestion(s.question));
          wrap.appendChild(chip);
        });
        bubble.appendChild(wrap);
      }

      msg.appendChild(avatar);
      msg.appendChild(bubble);
      els.messages.appendChild(msg);
      els.messages.scrollTop = els.messages.scrollHeight;
      return bubble;
    }

    function useSuggestion(text) {
      els.userInput.value = text;
      autosize();
      els.userInput.focus();
      els.userInput.setSelectionRange(text.length, text.length);
    }

    function addTyping() {
      const msg = document.createElement('div');
      msg.className = 'msg bot';
      msg.id = 'typingMsg';
      msg.innerHTML = '<div class="avatar" aria-hidden="true">K</div><div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>';
      els.messages.appendChild(msg);
      els.messages.scrollTop = els.messages.scrollHeight;
    }
    function removeTyping() {
      const el = document.getElementById('typingMsg');
      if (el) el.remove();
    }

    // ---------------------------------------------------------------------------
    // Send handler — calls Railway /chat endpoint
    // ---------------------------------------------------------------------------
    async function handleSend() {
      const question = els.userInput.value.trim();
      if (!question) return;

      addMessage('user', escapeHtml(question));
      els.userInput.value = '';
      autosize();
      addTyping();
      els.sendBtn.disabled = true;

      try {
        const res = await fetch(BACKEND_URL + '/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question }),
        });

        if (!res.ok) {
          let detail = 'Server error (' + res.status + ')';
          try {
            const body = await res.json();
            detail = body.error || detail;
          } catch (_) { }
          throw new Error(detail);
        }

        const data = await res.json();
        removeTyping();
        addMessage('bot', formatAnswer(data.answer || ''), data.suggestions || []);
      } catch (err) {
        removeTyping();
        const bubble = addMessage('bot', escapeHtml(err.message || 'Something went wrong. Please try again.'), null);
        bubble.classList.add('error');
      } finally {
        els.sendBtn.disabled = false;
        els.userInput.focus();
      }
    }

    // ---------------------------------------------------------------------------
    // Textarea auto-height
    // ---------------------------------------------------------------------------
    function autosize() {
      els.userInput.style.height = 'auto';
      els.userInput.style.height = Math.min(els.userInput.scrollHeight, 120) + 'px';
    }

    els.userInput.addEventListener('input', autosize);
    els.userInput.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        handleSend();
      }
    });
    els.sendBtn.addEventListener('click', handleSend);
  </script>
</body>

</html>
